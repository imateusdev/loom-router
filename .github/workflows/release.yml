name: Release

# Push a version tag (e.g. v0.2.0) to build Windows and macOS installers
# and publish them to a GitHub Release. The tag version must match
# src-tauri/tauri.conf.json and package.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$tauri_version" ]]; then
            echo "Tag v$tag_version does not match tauri.conf.json version $tauri_version"
            exit 1
          fi
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version"
            exit 1
          fi
          # Cargo.toml was not checked here and silently drifted to 0.1.0
          # while the app shipped 0.2.0. All three move together now.
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Tag v$tag_version does not match src-tauri/Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Frontend tests
        run: bun run test

      - name: Frontend typecheck and build
        run: bun run build

      - name: Set up Rust
        # Pinned to the head of this action's `stable` branch. The branch name
        # was the toolchain selector, so once it is replaced by a SHA the
        # toolchain has to be stated explicitly or the intent is unreadable.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Kept identical to ci.yml — this job is the same gate, and the two
      # drifting apart is how a release passes checks that main never ran.
      # See ci.yml for why the Ayatana package and why patchelf is gone.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows (NSIS + MSI)
            dmg_label: ""
            updater_asset: ""
            updater_label: ""
          - platform: macos-14
            label: macOS Apple Silicon (arm64)
            dmg_label: macOS Apple Silicon DMG (arm64)
            updater_asset: LoomRouter_aarch64.app.tar.gz
            updater_label: macOS Apple Silicon app bundle (updater)
          # Intel build is unsigned/ad-hoc (no Apple Developer cert):
          # users must right-click -> Open on first launch.
          - platform: macos-15-intel
            label: macOS Intel (x64)
            dmg_label: macOS Intel DMG (x64)
            updater_asset: LoomRouter_x64.app.tar.gz
            updater_label: macOS Intel app bundle (updater)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # The release body comes from CHANGELOG.md rather than a generated
      # commit list: the person installing the build wants to know what
      # changed for them, not which commits touched which file.
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## $version" '
            $0 == v { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)"
          if [[ -z "${notes// /}" ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (latest.json + .sig) so installed
          # apps can auto-update. Add this secret in the repo settings;
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD is only needed if the key
          # was generated with a password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          # Without an explicit tagName the action skips the release
          # creation and all uploads ("No releaseId or tagName provided").
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # tauri-action uploads assets with raw file names; give them friendly
      # labels. Installers/sigs are re-uploaded from disk (clobber keeps a
      # single copy); mac updater bundles are labeled via the API because
      # tauri-action already uploads them with the arch in the file name.
      - name: Apply friendly asset labels
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do
            gh release upload "$GITHUB_REF_NAME" "$f#Windows NSIS installer (x64)" --clobber
          done
          for f in src-tauri/target/release/bundle/nsis/*.nsis.zip; do
            gh release upload "$GITHUB_REF_NAME" "$f#Windows updater bundle (x64)" --clobber
          done
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            gh release upload "$GITHUB_REF_NAME" "$f#Windows MSI (x64)" --clobber
          done
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            gh release upload "$GITHUB_REF_NAME" "$f#${{ matrix.dmg_label }}" --clobber
          done
          for f in src-tauri/target/release/bundle/*/*.sig; do
            gh release upload "$GITHUB_REF_NAME" "$f#Signature ($(basename "$f"))" --clobber
          done
          if [ -n "${{ matrix.updater_asset }}" ]; then
            for name in "${{ matrix.updater_asset }}" "${{ matrix.updater_asset }}.sig"; do
              id=$(gh api "repos/:owner/:repo/releases/tags/$GITHUB_REF_NAME" \
                --jq ".assets[] | select(.name==\"$name\") | .id" || true)
              if [ -n "$id" ]; then
                case "$name" in
                  *.sig) lbl="Signature ($name)" ;;
                  *)     lbl="${{ matrix.updater_label }}" ;;
                esac
                gh api -X PATCH "repos/:owner/:repo/releases/assets/$id" -f label="$lbl"
              fi
            done
          fi
