name: Release

# Push a version tag (e.g. v0.2.0) to build Windows, macOS and Linux
# installers and publish them to a GitHub Release. The tag version must match
# src-tauri/tauri.conf.json and package.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$tauri_version" ]]; then
            echo "Tag v$tag_version does not match tauri.conf.json version $tauri_version"
            exit 1
          fi
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version"
            exit 1
          fi
          # Cargo.toml was not checked here and silently drifted to 0.1.0
          # while the app shipped 0.2.0. All three move together now.
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Tag v$tag_version does not match src-tauri/Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Frontend tests
        run: bun run test

      - name: Frontend typecheck and build
        run: bun run build

      - name: Set up Rust
        # Pinned to the head of this action's `stable` branch. The branch name
        # was the toolchain selector, so once it is replaced by a SHA the
        # toolchain has to be stated explicitly or the intent is unreadable.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Kept identical to ci.yml — this job is the same gate, and the two
      # drifting apart is how a release passes checks that main never ran.
      # See ci.yml for why the Ayatana package. This job does not bundle, so
      # the AppImage-only packages live in the build job instead.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows (NSIS + MSI)
            dmg_label: ""
            updater_suffix: ""
            updater_label: ""
          - platform: macos-14
            label: macOS Apple Silicon (arm64)
            dmg_label: macOS Apple Silicon DMG (arm64)
            updater_suffix: _aarch64.app.tar.gz
            updater_label: macOS Apple Silicon app bundle (updater)
          # Intel build is unsigned/ad-hoc (no Apple Developer cert):
          # users must right-click -> Open on first launch.
          - platform: macos-15-intel
            label: macOS Intel (x64)
            dmg_label: macOS Intel DMG (x64)
            updater_suffix: _x64.app.tar.gz
            updater_label: macOS Intel app bundle (updater)
          # ubuntu-22.04 rather than ubuntu-latest: the runner's glibc is the
          # floor for everyone who installs the build, and 24.04's 2.39 would
          # refuse to start on Debian 12 or on Ubuntu 22.04 itself.
          #
          # No updater_suffix. That field exists for the one macOS artifact
          # whose name on the release differs from its name on disk; every
          # Linux bundle keeps its own name, so the glob-and-label pass below
          # reaches all three without help.
          - platform: ubuntu-22.04
            label: Linux (deb + rpm + AppImage)
            dmg_label: ""
            updater_suffix: ""
            updater_label: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The quality job's list plus the two only the AppImage bundler wants.
      # patchelf rewrites the rpaths of the libraries linuxdeploy collects and
      # xdg-utils backs the desktop-file handling; cargo never asks for either,
      # so a runner without them compiles the whole crate and then fails at the
      # bundling step, which is the most expensive place to discover it.
      #
      # libfuse2 is deliberately absent. It is in most Tauri CI recipes because
      # linuxdeploy ships as an AppImage and an AppImage normally mounts itself
      # over FUSE, but tauri-bundler runs it with APPIMAGE_EXTRACT_AND_RUN=1
      # and --appimage-extract-and-run, so nothing here mounts anything.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # The release body comes from CHANGELOG.md rather than a generated
      # commit list: the person installing the build wants to know what
      # changed for them, not which commits touched which file.
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## $version" '
            $0 == v { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)"
          if [[ -z "${notes// /}" ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (latest.json + .sig) so installed
          # apps can auto-update. Add this secret in the repo settings;
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD is only needed if the key
          # was generated with a password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          # Without an explicit tagName the action skips the release
          # creation and all uploads ("No releaseId or tagName provided").
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      # tauri-action labels its uploads with the raw file name; replace those
      # with something a person can read.
      #
      # Labels are set with a PATCH on the existing asset, never by re-uploading
      # it. `gh release upload --clobber` deletes and recreates the asset, which
      # mints a new id — and tauri-action 1.0 writes latest.json with asset-id
      # URLs (0.6.2 used name-based ones, which survived a clobber). v0.2.12
      # shipped that way: latest.json pointed the Windows entries at ids that no
      # longer existed, so every Windows auto-update got a 404. macOS was intact
      # only because its bundles were already labeled through the API.
      #
      # Matching is by file-name suffix, not by exact name: 1.0 also puts the app
      # version into the .app.tar.gz name the way it already did for every other
      # bundle, and an exact-name lookup finds nothing after that rename — an
      # empty result being indistinguishable from "no such asset" here, the
      # labels would just quietly stop being applied.
      - name: Apply friendly asset labels
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          asset_id() {
            gh api "repos/:owner/:repo/releases/tags/$GITHUB_REF_NAME" \
              --jq ".assets[] | select(.name==\"$1\") | .id"
          }

          label_asset() {
            name="$1"
            label="$2"
            [ -n "$name" ] && [ -n "$label" ] || return 0
            id="$(asset_id "$name")"
            if [ -z "$id" ]; then
              echo "no release asset named $name" >&2
              return 1
            fi
            gh api -X PATCH "repos/:owner/:repo/releases/assets/$id" -f label="$label" --silent
          }

          # One local artifact and, where it has one, its detached signature.
          # Missing signatures are not an error: a dmg has none.
          label_local() {
            base="$(basename "$1")"
            label_asset "$base" "$2"
            label_asset "$base.sig" "Signature ($base.sig)" || true
          }

          # The local bundle directory is what scopes this job to the artifacts
          # it actually built. The release is shared by all three jobs running
          # in parallel, so querying it by suffix instead would let the Windows
          # job relabel a macOS dmg — with an empty string, its own dmg_label.
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do
            label_local "$f" "Windows NSIS installer (x64)"
          done
          for f in src-tauri/target/release/bundle/nsis/*.nsis.zip; do
            label_local "$f" "Windows updater bundle (x64)"
          done
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            label_local "$f" "Windows MSI (x64)"
          done
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            label_local "$f" "${{ matrix.dmg_label }}"
          done

          # Of the three Linux bundles only the AppImage updates itself in
          # place; deb and rpm hand the download to the package manager, which
          # wants a root prompt. Worth saying in the label, because the release
          # page is the only place anyone chooses between them.
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            label_local "$f" "Linux .deb (x64)"
          done
          for f in src-tauri/target/release/bundle/rpm/*.rpm; do
            label_local "$f" "Linux .rpm (x64)"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            label_local "$f" "Linux AppImage (x64, self-updating)"
          done

          # The one artifact whose release name differs from its name on disk:
          # tauri-action uploads `LoomRouter.app.tar.gz` as
          # `LoomRouter_<version>_<arch>.app.tar.gz`. The suffix carries the
          # arch, so this stays scoped to one job even against the shared
          # release. Matched by suffix rather than exact name because 1.0 added
          # the version to it — an exact-name lookup finds nothing after that
          # rename, and an empty result is indistinguishable from "no such
          # asset", so the labels would quietly stop being applied.
          suffix="${{ matrix.updater_suffix }}"
          if [ -n "$suffix" ]; then
            gh api "repos/:owner/:repo/releases/tags/$GITHUB_REF_NAME" \
              --jq ".assets[]
                    | select(.name | endswith(\"$suffix\") or endswith(\"$suffix.sig\"))
                    | .name" |
            while read -r name; do
              case "$name" in
                *.sig) label_asset "$name" "Signature ($name)" ;;
                *)     label_asset "$name" "${{ matrix.updater_label }}" ;;
              esac
            done
          fi

  # latest.json is what every installed app polls, so a release that published
  # one pointing at missing assets is a silent no-update for everyone on that
  # platform.
  #
  # Its own job rather than a step inside the matrix: the four build jobs run in
  # parallel, so a check living in any one of them runs while the other three
  # may still be uploading, and sees a manifest that is not the one users get.
  #
  # No checkout. GH_REPO is what lets `gh` resolve `:owner/:repo` without a
  # local git remote, and the manifest is read from the release, not the tree.
  verify-updater:
    name: Verify updater manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api "repos/:owner/:repo/releases/tags/$GITHUB_REF_NAME" --jq '.assets[].id' > ids.txt
          latest_id="$(gh api "repos/:owner/:repo/releases/tags/$GITHUB_REF_NAME" \
            --jq '.assets[] | select(.name=="latest.json") | .id')"
          if [ -z "$latest_id" ]; then
            echo "this release has no latest.json at all"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/:owner/:repo/releases/assets/$latest_id" > latest.json

          fail=0

          # 1. Nothing the manifest points at has gone missing. This is the
          #    v0.2.12 failure: latest.json carried asset-id URLs and the ids
          #    had been recycled out from under it, so every update 404'd.
          while read -r url; do
            case "$url" in
              */releases/assets/*)
                referenced="${url##*/}"
                if ! grep -qx "$referenced" ids.txt; then
                  echo "latest.json references asset $referenced, which is not in this release"
                  fail=1
                fi
                ;;
            esac
          done < <(jq -r '.platforms[].url' latest.json)

          # 2. Every platform we build is actually in there. Check 1 passes
          #    happily on a manifest that is simply missing one: tauri-action
          #    merges latest.json read-modify-write with no locking and all four
          #    jobs write it, so two of them reading the same snapshot silently
          #    drops whichever wrote first. The updater looks up
          #    `{os}-{arch}-{installer}` and falls back to `{os}-{arch}`, so the
          #    bare key is the one that has to be present for every platform.
          for key in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            if ! jq -e --arg k "$key" '.platforms[$k].url' latest.json > /dev/null; then
              echo "latest.json has no $key entry; that platform will never see this update"
              fail=1
            fi
          done

          exit $fail
