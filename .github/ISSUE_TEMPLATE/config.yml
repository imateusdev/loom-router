# Kept true deliberately. With Discussions off, a blank issue is the only
# place a question like "how do I point this at provider X?" can go — forcing
# it through the bug template instead produces a fake bug report with invented
# reproduction steps, which is worse to triage than a plain question.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability
    url: https://github.com/imateusdev/loom-router/blob/main/SECURITY.md
    about: >-
      Open a normal bug report — public is fine. LoomRouter runs only on your
      own machine, so there's no fleet to protect with a disclosure window.
      SECURITY.md explains what's in scope, and links the private form if
      you'd rather use it.
