blank_issues_enabled: false

contact_links:
  - name: Question or setup help
    url: https://github.com/imateusdev/loom-router/discussions
    about: >-
      "How do I point LoomRouter at provider X?" and anything that isn't a bug
      or a feature request belongs in Discussions. Issues stay as the list of
      things that are broken or missing.

  - name: Security vulnerability
    url: https://github.com/imateusdev/loom-router/security/advisories/new
    about: >-
      Do NOT open a public issue. LoomRouter holds provider API keys and a
      local proxy token on disk — report privately so a fix ships before the
      details are public. See SECURITY.md.
