blank_issues_enabled: false

contact_links:
  - name: Question or setup help
    url: https://github.com/imateusdev/loom-router/discussions
    about: >-
      "How do I point LoomRouter at provider X?" and anything that isn't a bug
      or a feature request belongs in Discussions. Issues stay as the list of
      things that are broken or missing.

  - name: Security vulnerability
    url: https://github.com/imateusdev/loom-router/blob/main/SECURITY.md
    about: >-
      Open a normal bug report — public is fine. LoomRouter runs only on your
      own machine, so there's no fleet to protect with a disclosure window.
      SECURITY.md explains what's in scope, and links the private form if
      you'd rather use it.
