[package]
name = "loom-router"
# Kept in lockstep with package.json and tauri.conf.json; the release
# workflow verifies all three against the tag.
version = "0.2.9"
description = "Weave any model into your coding agent's picker."
authors = ["LoomRouter contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "loom_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http2", "ws"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"], default-features = false }
toml = "0.8"
dirs = "6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["decompression-full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
rmcp = { version = "3.1.2", features = ["client", "transport-io"] }
schemars = "1"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
